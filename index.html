<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Stack technique</title>
<script>
/* Thème : ?theme=dark|light force, sinon on suit le système. Posé avant le premier rendu pour éviter le flash. */
(function(){
  var p = new URLSearchParams(location.search).get("theme");
  var sombre = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = (p === "dark" || p === "light") ? p : (sombre ? "dark" : "light");
})();
</script>
<style>
/* ───────── Jetons ───────── */
:root{
  color-scheme:light;
  --font:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --bg:#f5f5f7; --glow-1:rgba(0,122,255,.10); --glow-2:rgba(175,82,222,.07);
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#a1a1a6;
  --hair:rgba(60,60,67,.12); --hover:rgba(118,118,128,.10);
  --tile:#ffffff; --tile-line:rgba(0,0,0,.07); --glyph:#1d1d1f;
  --tile-strong:#1d1d1f; --tile-strong-line:#1d1d1f; --glyph-strong:#ffffff;
  --tile-soft-line:rgba(60,60,67,.30); --glyph-soft:#515154;
  --tile-dim:#eeeef1; --tile-dim-line:rgba(0,0,0,.025); --glyph-dim:#cdcdd2; --name-dim:#bcbcc2;
  --tile-shadow:drop-shadow(0 1px 1px rgba(0,0,0,.05)) drop-shadow(0 7px 14px rgba(0,0,0,.07));
  --tile-shadow-up:drop-shadow(0 2px 2px rgba(0,0,0,.06)) drop-shadow(0 14px 22px rgba(0,0,0,.12));
  --glass:rgba(255,255,255,.64); --glass-line:rgba(255,255,255,.75);
  --glass-shadow:0 0 0 .5px rgba(0,0,0,.06),0 28px 70px rgba(0,0,0,.09),0 2px 8px rgba(0,0,0,.04);
  --card:rgba(255,255,255,.66); --card-line:rgba(0,0,0,.05);
  --track:rgba(118,118,128,.12); --thumb:#ffffff; --thumb-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);
  --accent:#0071e3;
  --ok:#34c759; --warn:#ff9500; --crit:#ff3b30; --todo:#8e8e93;
  --l-pilotage:#007aff; --l-memoire:#af52de; --l-code:#0b9aa8; --l-donnees:#ff2d55;
  --link-rest:rgba(60,60,67,.18); --link-faint:rgba(60,60,67,.055);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --glow-1:rgba(10,132,255,.20); --glow-2:rgba(191,90,242,.13);
  --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#6e6e73;
  --hair:rgba(235,235,245,.11); --hover:rgba(235,235,245,.08);
  --tile:#1c1c1e; --tile-line:rgba(255,255,255,.09); --glyph:#f5f5f7;
  --tile-strong:#f5f5f7; --tile-strong-line:#f5f5f7; --glyph-strong:#1d1d1f;
  --tile-soft-line:rgba(235,235,245,.28); --glyph-soft:#c7c7cc;
  --tile-dim:#0e0e10; --tile-dim-line:rgba(255,255,255,.04); --glyph-dim:#36363a; --name-dim:#434347;
  --tile-shadow:drop-shadow(0 1px 1px rgba(0,0,0,.5)) drop-shadow(0 8px 16px rgba(0,0,0,.5));
  --tile-shadow-up:drop-shadow(0 2px 2px rgba(0,0,0,.5)) drop-shadow(0 16px 26px rgba(0,0,0,.7));
  --glass:rgba(30,30,32,.62); --glass-line:rgba(255,255,255,.10);
  --glass-shadow:0 0 0 .5px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.55);
  --card:rgba(255,255,255,.055); --card-line:rgba(255,255,255,.06);
  --track:rgba(118,118,128,.24); --thumb:#636366; --thumb-shadow:0 1px 4px rgba(0,0,0,.4);
  --accent:#0a84ff;
  --ok:#30d158; --warn:#ff9f0a; --crit:#ff453a; --todo:#8e8e93;
  --l-pilotage:#0a84ff; --l-memoire:#bf5af2; --l-code:#40c8e0; --l-donnees:#ff375f;
  --link-rest:rgba(235,235,245,.17); --link-faint:rgba(235,235,245,.05);
}

/* ───────── Base ───────── */
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}   /* sans lui, le display:grid des boutons ronds l'emporte et le bouton Plan s'affiche dans la copie partagée */
html,body{height:100%}
body{
  font-family:var(--font);font-size:13px;line-height:1.4;color:var(--text);background-color:var(--bg);
  background-image:radial-gradient(760px 520px at 96% -6%,var(--glow-1),transparent 70%),radial-gradient(680px 560px at 104% 96%,var(--glow-2),transparent 70%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100vh;min-height:760px;display:grid;grid-template-columns:minmax(0,1fr) 348px;grid-template-rows:72px minmax(0,1fr);column-gap:24px;padding:0 24px 20px 28px}

/* ───────── Barre du haut ───────── */
.top{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 348px;column-gap:24px;align-items:center}
.top-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:16px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:21px;font-weight:600;white-space:nowrap}
.brand span{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-side{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.maj{font-size:12px;color:var(--text-2)}
.icon-btn{width:30px;height:30px;border-radius:50%;border:0;background:var(--track);display:grid;place-items:center;cursor:pointer;transition:background .2s}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.seg{position:relative;display:inline-flex;padding:2px;border-radius:10px;background:var(--track)}
.seg-thumb{position:absolute;top:2px;left:0;height:calc(100% - 4px);width:0;border-radius:8px;background:var(--thumb);box-shadow:var(--thumb-shadow);transition:transform .32s cubic-bezier(.3,.7,.2,1),width .32s cubic-bezier(.3,.7,.2,1)}
.seg button{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 15px;border:0;background:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg .sw{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* ───────── Carte ───────── */
.map{position:relative;z-index:0;display:grid;grid-auto-rows:minmax(116px,1fr);min-height:0}
.row{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:start;padding-top:17px;border-top:1px solid var(--hair)}
.row:first-of-type{border-top-color:transparent}
.row-head{padding-top:12px;cursor:default}
.row-name{font-size:13px;font-weight:600;line-height:16px}
.row-count{font-size:12px;color:var(--text-2);margin-top:2px}
.tiles{display:flex;justify-content:center}
.tile{position:relative;z-index:1;flex:0 1 100px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0;border:0;background:none;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.tile:focus-visible{outline:none}
.ico-wrap{position:relative;width:56px;height:56px;filter:var(--tile-shadow);transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s}
.ico{display:block;width:100%;height:100%;overflow:visible}
.plate{fill:var(--tile);stroke:var(--tile-line);stroke-width:1.2;transition:fill .22s,stroke .22s}
.glyph{fill:none;stroke:var(--glyph);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .22s}
.ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;transition:opacity .18s}
.imp-3 .plate{fill:var(--tile-strong);stroke:var(--tile-strong-line)}
.imp-3 .glyph{stroke:var(--glyph-strong)}
.imp-1 .plate{fill:var(--bg);stroke:var(--tile-soft-line)}
.imp-1 .glyph{stroke:var(--glyph-soft)}
.imp-1 .ico-wrap,.etat-a-venir .ico-wrap{filter:none}
.etat-a-venir .plate{fill:var(--bg);stroke:var(--tile-soft-line);stroke-dasharray:5 4.5}
.etat-a-venir .glyph{stroke:var(--text-3)}
.etat-a-venir .name{color:var(--text-2)}
.badge{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2.5px var(--bg);transition:opacity .22s}
.name{max-width:112px;margin:0 -6px;font-size:12px;line-height:15px;font-weight:500;text-align:center;text-wrap:balance;color:var(--text);
  text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 7px var(--bg),0 0 7px var(--bg);transition:color .22s}
.tile:hover .ico-wrap,.tile.is-active .ico-wrap{transform:translateY(-1px) scale(1.045);filter:var(--tile-shadow-up)}
.tile.imp-1:hover .ico-wrap,.tile.imp-1.is-active .ico-wrap,.tile.etat-a-venir:hover .ico-wrap,.tile.etat-a-venir.is-active .ico-wrap{filter:none}
.tile.is-active .ring,.tile:focus-visible .ring{opacity:1}
.tile.is-pinned .name{font-weight:600}
.map.dimming .tile.on{z-index:3}
.map.dimming .tile:not(.on) .plate{fill:var(--tile-dim);stroke:var(--tile-dim-line);stroke-dasharray:none}
.map.dimming .tile:not(.on) .glyph{stroke:var(--glyph-dim)}
.map.dimming .tile:not(.on) .name{color:var(--name-dim)}
.map.dimming .tile:not(.on) .ico-wrap{filter:none}
.map.dimming .tile:not(.on) .badge{opacity:.3}

/* ───────── Liens ───────── */
.links{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
.links.dessus{z-index:2}
.links path{fill:none}
.base path{stroke:var(--link-rest);stroke-width:1;stroke-linecap:round;transition:stroke .25s,opacity .25s}
.base.faint path{stroke:var(--link-faint)}
.base path.off{opacity:0}
.hot g{transition:opacity .2s}
.hot .l{stroke:var(--c);stroke-width:1.75;stroke-dasharray:1;stroke-dashoffset:0;animation:trace .46s cubic-bezier(.45,0,.2,1) both}
.hot .tip{stroke:var(--c);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;animation:appear .18s both}
.hot .dot{fill:var(--c);animation:appear .18s both}
.hot.instant .l,.hot.instant .tip,.hot.instant .dot{animation:none}
.hot.solo g:not(.is-solo){opacity:.2}
.hot g.is-solo .l{stroke-width:2.6}
@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes appear{from{opacity:0}to{opacity:1}}

/* ───────── Inspecteur ───────── */
.inspector{position:relative;min-height:0;display:flex;flex-direction:column;border-radius:26px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(42px) saturate(180%);backdrop-filter:blur(42px) saturate(180%);overflow:hidden}
.insp{flex:1;min-height:0;overflow-y:auto;padding:22px 18px 26px;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent);scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
.insp>*{animation:appear .22s both}
.insp.still>*{animation:none}
.eyebrow{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
.i-title{font-size:22px;font-weight:600;line-height:1.15;margin-top:2px}
.i-sub{font-size:13px;color:var(--text-2);margin-top:4px}
.i-head{display:grid;grid-template-columns:60px minmax(0,1fr) 28px;column-gap:14px;align-items:center}
.i-head .ico-wrap{width:60px;height:60px}
.i-head .i-title{font-size:20px;margin:0}
.i-role{font-size:14px;line-height:1.45;margin:16px 2px 0}
.close{width:28px;height:28px;border-radius:50%;border:0;background:var(--track);display:grid;place-items:center;cursor:pointer;align-self:start}
.close svg{width:11px;height:11px;fill:none;stroke:var(--text-2);stroke-width:1.8;stroke-linecap:round}
.card{margin-top:14px;border-radius:16px;background:var(--card);border:1px solid var(--card-line);overflow:hidden}
.sec{margin:16px 4px 0;display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--text-2)}
.sec+.card{margin-top:7px}
.sec em{font-style:normal;font-weight:500}
.age{display:grid;grid-template-columns:52px minmax(0,1fr);column-gap:14px;align-items:center;padding:14px}
.age-ring{position:relative;width:52px;height:52px}
.age-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600}
.age strong{display:block;font-size:17px;font-weight:600;line-height:1.2}
.age span{display:block;font-size:12px;color:var(--text-2);margin-top:2px}
.kv{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;padding:10px 14px;font-size:13px}
.kv+.kv::before,.lk+.lk::before,.gauge+.gauge::before{content:"";position:absolute;top:0;right:0;left:14px;height:1px;background:var(--hair)}
.kv>span:first-child{color:var(--text-2)}
.kv>span:last-child{text-align:right}
.kv .note{grid-column:1/-1;text-align:left;color:var(--text-2);font-size:12px;line-height:16px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:7px;font-weight:500}
.pill i,.leg i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.lk{position:relative;display:grid;grid-template-columns:8px minmax(0,1fr);column-gap:11px;width:100%;padding:7px 14px;border:0;background:none;text-align:left;cursor:pointer;transition:background .15s}
.lk:hover,.lk:focus-visible{background:var(--hover)}
.lk:focus-visible{outline-offset:-2px}
.lk i{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:5px}
.lk b{display:block;font-size:13px;font-weight:600}
.lk span{display:block;font-size:12px;line-height:16px;color:var(--text-2)}
.lk+.lk::before{left:33px}
.empty{padding:12px 14px;font-size:12px;color:var(--text-2)}
.rings{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:18px;align-items:center;padding:12px 16px}
.rings svg{display:block;width:104px;height:104px}
.leg{display:flex;align-items:center;gap:9px;font-size:13px;padding:3.5px 0}
.leg span{flex:1}
.leg b{font-weight:600;font-variant-numeric:tabular-nums}
.gauge{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 84px 18px;column-gap:12px;align-items:center;width:100%;padding:5.5px 14px;border:0;background:none;text-align:left;font-size:13px}
button.gauge{cursor:pointer;transition:background .15s}
button.gauge:hover{background:var(--hover)}
button.gauge:focus-visible{outline-offset:-2px}
.gauge .lab{display:flex;align-items:center;gap:9px;min-width:0}
.gauge .lab i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.gauge .bar{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.gauge .bar u{display:block;height:100%;border-radius:2px;background:var(--c,var(--text));opacity:.9}
.gauge b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.hint{margin:12px 6px 0;font-size:12px;line-height:17px;color:var(--text-2)}
kbd{font:inherit;font-size:11px;padding:1px 5px;border-radius:5px;background:var(--track)}

/* ───────── Listes d'un module (ce qu'il contient, ce qu'on peut ouvrir) ───────── */
a.lk{text-decoration:none;color:inherit}
.lk.ouvrable{grid-template-columns:8px minmax(0,1fr) 14px}
.lk .ext{align-self:center;width:13px;height:13px;fill:none;stroke:var(--text-3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lk:hover .ext,.lk:focus-visible .ext{stroke:var(--accent)}
.lk.fixe{cursor:default}
.lk.fixe:hover{background:none}
.lk.fixe i{background:var(--text-3);opacity:.5}

/* ───────── Plan d'action ───────── */
.icon-btn{position:relative}
.pastille{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit);color:#fff;
  font-size:10px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--bg);font-variant-numeric:tabular-nums}
.tache{border:0}
.tache+.tache{border-top:1px solid var(--hair)}
.tache summary{list-style:none;display:grid;grid-template-columns:9px minmax(0,1fr);column-gap:11px;padding:10px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tache summary::-webkit-details-marker{display:none}
.tache summary:hover,.tache summary:focus-visible{background:var(--hover)}
.tache summary:focus-visible{outline-offset:-2px}
.tache .urg{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.tache .t{font-size:13px;font-weight:600;line-height:1.35}
.tache .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.chip{font-size:11px;line-height:17px;padding:0 7px;border-radius:9px;background:var(--track);color:var(--text-2);white-space:nowrap}
.chip.neuf{background:var(--accent);color:#fff}
.chip.date{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tache .corps{padding:2px 14px 14px 34px;display:flex;flex-direction:column;gap:9px}
.tache .corps p,.tache .corps li{font-size:12.5px;line-height:18px;color:var(--text-2)}
.tache .corps ol{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:5px}
.tache .corps ol li::marker{color:var(--text-3);font-size:11px}
.tache .corps .src{font-size:11px;color:var(--text-3)}
.tache .voir{align-self:flex-start;border:0;background:var(--track);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:500;cursor:pointer}
.tache .voir:hover{background:var(--hover)}
.tache[data-etat="fait"] summary .t{text-decoration:line-through;color:var(--text-3);font-weight:500}
.tache[data-etat="fait"] .urg{background:var(--ok);opacity:.55}

/* ───────── Lien de retour (posé par l'appli qui sert la page, à la place du marqueur RETOUR) ───────── */
.retour{display:inline-flex;align-items:center;gap:5px;align-self:center;height:28px;padding:0 12px 0 9px;margin-right:2px;border-radius:14px;background:var(--track);
  font-size:13px;font-weight:500;color:var(--accent);text-decoration:none;white-space:nowrap}
.retour::before{content:"";width:7px;height:7px;margin-left:3px;border-left:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg)}
.retour:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.resume-bar,.grab,.sheet-close{display:none}

/* ───────── Tablette et téléphone : une colonne, et l'inspecteur devient une feuille qui monte du bas ───────── */
@media (max-width:1100px){
  html,body{height:auto;min-height:100%}
  body{font-size:14px;background-attachment:scroll}
  button,a{touch-action:manipulation}
  .app{display:block;height:auto;min-height:0;padding:0 16px calc(var(--sheet-h,0px) + 32px + env(safe-area-inset-bottom,0px))}

  /* Barre du haut : collante, titre + thème sur une ligne, filtre défilant dessous */
  .top{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand side" "seg seg";row-gap:10px;column-gap:12px;align-items:center;
    margin:0 -16px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 10px calc(16px + env(safe-area-inset-left,0px));
    background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--hair)}
  .top-main{display:contents}
  .top-main>div:last-child{display:none}
  .brand{grid-area:brand;gap:8px}
  .brand h1{font-size:19px}
  .brand span{display:none}
  .top-side{grid-area:side}
  .maj{display:none}
  .icon-btn{width:34px;height:34px}
  .seg{grid-area:seg;display:flex;width:100%;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}   /* min-width:0 : sans lui, le filtre élargit toute la page */
  .seg::-webkit-scrollbar{display:none}
  .seg button{height:34px;padding:0 6px;gap:6px;font-size:13px;flex:1 1 0;min-width:62px;justify-content:center}

  /* Le résumé en une ligne : ce qui va, ce qui demande ton attention */
  .resume-bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;width:100%;margin:14px 0 2px;padding:12px 14px;border:1px solid var(--card-line);border-radius:16px;background:var(--card);
    font-size:14px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .resume-bar .rb-c{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .resume-bar .rb-c i{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .resume-bar .rb-c b{font-weight:600;font-variant-numeric:tabular-nums}
  .resume-bar .rb-go{margin-left:auto;width:8px;height:8px;border-right:1.8px solid var(--text-3);border-top:1.8px solid var(--text-3);transform:rotate(45deg)}

  /* La carte : une couche par bloc, les tuiles en grille régulière, des cibles assez grandes pour le pouce */
  .map{display:block}
  .row{display:block;padding:16px 0 18px}
  .row-head{padding:0 0 12px;display:flex;gap:8px;align-items:baseline}
  .row-name{font-size:15px}
  .row-count{font-size:13px;margin:0}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));justify-content:stretch;gap:16px 4px}
  .tile{flex:none;width:auto;padding:4px 0;gap:6px}
  .ico-wrap{width:54px;height:54px}
  .name{max-width:none;margin:0 2px;font-size:12px}
  .base{display:none}                      /* au repos, pas de toile de fond : les liens n'apparaissent qu'à la sélection ou au filtre */
  .hot .l{stroke-width:2}

  /* La feuille */
  .inspector{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0 auto;max-width:640px;height:max(var(--sheet-h,0px),112px);border-radius:22px 22px 0 0;border-bottom:0;
    padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(0);visibility:visible;
    transition:height .34s cubic-bezier(.2,.8,.2,1),transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .inspector[data-feuille="fermee"]{transform:translateY(110%);visibility:hidden;transition:height .34s cubic-bezier(.2,.8,.2,1),transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s}
  .inspector.glisse{transition:none}
  .grab{display:block;flex:none;width:100%;height:26px;border:0;background:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
  .grab::before{content:"";display:block;width:38px;height:5px;margin:9px auto 0;border-radius:3px;background:var(--text-3);opacity:.55}
  .sheet-close{display:grid;place-items:center;position:absolute;top:14px;right:14px;z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:var(--track);cursor:pointer}
  .sheet-close svg{width:12px;height:12px;fill:none;stroke:var(--text-2);stroke-width:1.8;stroke-linecap:round}
  .insp{padding:4px 16px 28px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .i-head{grid-template-columns:56px minmax(0,1fr) 36px}
  .i-head .ico-wrap{width:56px;height:56px}
  .i-head .close{display:none}
  .i-title{padding-right:40px}
  .i-head .i-title{padding-right:0}
  .i-role{font-size:15px}
  .sec{font-size:13px;margin-top:18px}
  .kv{font-size:14px;padding:12px 14px}
  .kv .note{font-size:13px;line-height:18px}
  .lk{padding:10px 14px;min-height:48px;align-items:start}
  .lk b{font-size:15px}
  .lk span{font-size:13px;line-height:17px}
  .lk i{margin-top:6px}
  .leg,.gauge{font-size:14px}
  .gauge{padding:8px 14px}
  .age span{font-size:13px}
  .hint{font-size:13px;line-height:18px}
  .hint kbd{display:none}
}
@media (max-width:1100px) and (min-width:700px){
  .tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .brand span{display:inline}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
.mot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(560px,calc(100% - 32px));background:var(--text);color:var(--bg);padding:11px 15px;border-radius:13px;font-size:13px;line-height:1.45;box-shadow:0 14px 38px rgba(0,0,0,.30)}
</style>

      h("span", { text: "En service depuis", style: "margin:0 0 1px" }), h("strong", { text: a && a.futur ? "Prévu le " + dateLongue(a.de) : "Pas encore en service" }),

  if (a && !a.futur) bloc.lastChild.appendChild(h("span", { text: "Né le " + dateLongue(a.de), style: "margin-top:1px" }));

  /* Fiche */
  var fiche = h("div", { "class": "card" });
  if (m.hebergement) fiche.appendChild(h("div", { "class": "kv" }, [ h("span", { text: "Hébergement" }), h("span", { text: m.hebergement }) ]));
  if (m.techno) fiche.appendChild(h("div", { "class": "kv" }, [ h("span", { text: "Techno" }), h("span", { text: m.techno }) ]));
  fiche.appendChild(h("div", { "class": "kv" }, [ h("span", { text: "État" }), h("span", {}, [ h("span", { "class": "pill" }, [ h("i", { style: "--c:" + e.c }), e.nom ]) ]),
    m.etatNote ? h("span", { "class": "note", text: m.etatNote }) : null ]));
  insp.appendChild(fiche);

  /* Ce qu'il contient : la liste, avec un lien quand c'est publié */
  if (m.items && m.items.length){
    insp.appendChild(titreSection(m.itemsTitre || "Ce qu'il contient", String(m.items.length)));
    var carteI = h("div", { "class": "card" });
    m.items.forEach(function(it){ carteI.appendChild(ligneItem(it)); });
    insp.appendChild(carteI);
    if (m.itemsNote) insp.appendChild(h("p", { "class": "hint", style: "margin:9px 6px 0", text: m.itemsNote }));
  }

  /* Reçoit de / Envoie vers */
  [["Reçoit de", "vers", "de"], ["Envoie vers", "de", "vers"]].forEach(function(x){
    var liste = LIENS.filter(function(l){ return l[x[1]] === m.id; });
    insp.appendChild(titreSection(x[0], String(liste.length)));
    var carte = h("div", { "class": "card" });
    if (!liste.length) carte.appendChild(h("div", { "class": "empty", text: x[1] === "vers" ? "Rien n'arrive ici pour l'instant." : "Ne pousse rien ailleurs pour l'instant." }));
    liste.forEach(function(l){
      var autre = byId[l[x[2]]], horsFiltre = st.filtre !== "tout" && l.type !== st.filtre;
      var b = ligneModule(autre, l.label || (S.typesDeLien[l.type] || {}).nom || "", couleurLien(l.type), function(){ epingler(autre.id); }, horsFiltre ? null : LIENS.indexOf(l));
      b.title = ((S.typesDeLien[l.type] || {}).nom || l.type) + (horsFiltre ? " (masqué par le filtre)" : "");
      if (horsFiltre) b.style.opacity = ".5";

}

/* ───────── Interactions ───────── */
var minuterie = null;
function epingler(id){
  st.epingle = id && byId[id] ? id : null; st.survol = null; st.solo = null; st.plan = false;
  if (compact.matches){
    if (st.epingle){ resumeOuvert = false; if (etatFeuille === "fermee" || etatFeuille === "coup-d-oeil") poserFeuille("ouverte"); }
    else if (!resumeOuvert) poserFeuille("fermee");
  }
  peindre(true); ecrireURL();
  if (st.epingle) assurerVisible(st.epingle);
}
function ecrireURL(){
  try {
    var u = new URL(location.href);
    if (st.epingle) u.searchParams.set("focus", st.epingle); else u.searchParams.delete("focus");
    if (st.filtre !== "tout") u.searchParams.set("filtre", st.filtre); else u.searchParams.delete("filtre");
    if (st.plan) u.searchParams.set("vue", "plan"); else u.searchParams.delete("vue");
    history.replaceState(null, "", u.toString());
  } catch (err) { /* en file://, certains navigateurs refusent : sans gravité */ }
}
Object.keys(tiles).forEach(function(id){
  var el = tiles[id].el;
  if (survolPossible){
    el.addEventListener("mouseenter", function(){ clearTimeout(minuterie); st.survol = id; peindre(); });
    el.addEventListener("mouseleave", function(){ clearTimeout(minuterie); minuterie = setTimeout(function(){ st.survol = null; peindre(); }, 110); });
  }
  el.addEventListener("focus", function(){ if (el.matches(":focus-visible")){ st.clavier = id; peindre(); } });
  el.addEventListener("blur", function(){ if (st.clavier === id){ st.clavier = null; peindre(); } });
  el.addEventListener("click", function(ev){ ev.stopPropagation(); epingler(st.epingle === id ? null : id); });
});
map.addEventListener("click", function(){ if (st.epingle) epingler(null); else if (compact.matches && resumeOuvert) fermerFeuille(); });
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape"){ if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); st.clavier = null; epingler(null); return; }
  var t = ev.target.closest ? ev.target.closest(".map .tile") : null; if (!t || ev.key.indexOf("Arrow") !== 0) return;
  var r = tiles[t.getAttribute("data-id")].rang, ligne = rangees[r], i = ligne.indexOf(t), cible = null;
  if (ev.key === "ArrowLeft") cible = ligne[i - 1]; else if (ev.key === "ArrowRight") cible = ligne[i + 1];
  else {
    var autre = rangees[r + (ev.key === "ArrowDown" ? 1 : -1)], x = t.getBoundingClientRect(); x = x.left + x.width / 2;
    if (autre) cible = autre.reduce(function(p, q){ var a = p.getBoundingClientRect(), b = q.getBoundingClientRect(); return Math.abs(b.left + b.width / 2 - x) < Math.abs(a.left + a.width / 2 - x) ? q : p; });
  }
  if (cible){ ev.preventDefault(); cible.focus(); }
});
/* ───────── Compact : la ligne de résumé, la poignée et la croix de la feuille ───────── */
(function(){
  var barre = document.getElementById("resume");
  Object.keys(ETATS).forEach(function(k){
    var n = S.modules.filter(function(x){ return x.etat === k; }).length; if (!n) return;
    barre.appendChild(h("span", { "class": "rb-c" }, [ h("i", { style: "--c:" + ETATS[k].c }), h("b", { text: String(n) }), ETATS[k].nom.toLowerCase() ]));
  });
  barre.appendChild(h("span", { "class": "rb-go", "aria-hidden": "true" }));
  barre.addEventListener("click", function(){ resumeOuvert = true; st.epingle = null; st.survol = null; peindre(true); ecrireURL(); poserFeuille("ouverte"); });
})();
function fermerFeuille(){
  resumeOuvert = false;
  if (st.epingle){ epingler(null); return; }
  if (st.plan){ st.plan = false; peindre(true); ecrireURL(); }
  poserFeuille("fermee");
}
document.getElementById("sheet-close").addEventListener("click", fermerFeuille);
(function(){
  var y0 = null, h0 = 0, bouge = false;
  function basculer(){ poserFeuille(etatFeuille === "ouverte" ? "coup-d-oeil" : "ouverte"); }
  grab.addEventListener("pointerdown", function(ev){
    if (!compact.matches) return;
    y0 = ev.clientY; h0 = hauteurFeuille(etatFeuille); bouge = false; feuille.classList.add("glisse");
    try { grab.setPointerCapture(ev.pointerId); } catch (err) {}
  });
  grab.addEventListener("pointermove", function(ev){
    if (y0 == null) return;
    var dy = ev.clientY - y0; if (Math.abs(dy) > 6) bouge = true;
    if (bouge) document.documentElement.style.setProperty("--sheet-h", Math.max(72, Math.min(window.innerHeight - 76, h0 - dy)) + "px");
  });
  function fin(ev){
    if (y0 == null) return;
    var hFin = h0 - (ev.clientY - y0); y0 = null; feuille.classList.remove("glisse");
    if (!bouge){ basculer(); return; }
    if (hFin < 70){ fermerFeuille(); return; }
    var mieux = "coup-d-oeil";
    ["ouverte", "pleine"].forEach(function(c){ if (Math.abs(hauteurFeuille(c) - hFin) < Math.abs(hauteurFeuille(mieux) - hFin)) mieux = c; });
    poserFeuille(mieux);
  }
  grab.addEventListener("pointerup", fin); grab.addEventListener("pointercancel", fin);
  grab.addEventListener("click", function(ev){ if (ev.detail === 0) basculer(); });   /* activation au clavier : pas de pointeur */
})();
window.addEventListener("resize", function(){ if (compact.matches) poserFeuille(etatFeuille); });
if (compact.addEventListener) compact.addEventListener("change", function(){
  poserFeuille(compact.matches ? (st.epingle ? "ouverte" : "fermee") : "fermee"); resumeOuvert = false; recalculer();
});

  st.plan = true; st.epingle = null; st.survol = null; st.clavier = null;

(function(){

/* ───────── Le bouton Partager : le même fichier, mais anonyme ─────────
   On repart du squelette de la page (styles et code compris), on y colle les données passées par
   window.ANONYME, et on télécharge le tout. Le plan n'est pas du voyage : sans window.PLAN, la carte
   masque son bouton d'elle-même. Si un nom public manque ou si une info sensible survit, rien ne sort. */
(function(){
  var b = document.getElementById("partage-btn"), minuteur;
  if (!b) return;
  if (!window.ANONYME){ b.hidden = true; return; }

  function mot(txt, duree){
    var t = document.getElementById("mot");
    if (!t){ t = h("div", { id: "mot", "class": "mot", role: "status" }); document.body.appendChild(t); }
    t.textContent = txt; t.hidden = false;
    clearTimeout(minuteur); minuteur = setTimeout(function(){ t.hidden = true; }, duree || 6000);
  }

  /* Le lien d'abord : quand la version anonyme est publiée (ANONYME.lien), le clic copie son adresse.
     Un fichier HTML ne s'affiche pas dans l'aperçu d'une messagerie, un lien s'ouvre partout.
     Maj+clic, ou pas de lien : on fabrique le fichier. */
  var lien = window.ANONYME.lien;
  function copier(txt){
    function secours(){
      var z = h("textarea", { readonly: "", style: "position:fixed;top:0;left:0;opacity:0" }), ok = false;
      z.value = txt; document.body.appendChild(z); z.select();
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(z); return ok;
    }
    if (navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(txt).then(function(){ return true; }, secours);
    return Promise.resolve(secours());
  }
  if (lien){
    b.title = "Copier le lien de la version partageable (anonyme) · Maj+clic : télécharger le fichier";
    b.setAttribute("aria-label", "Copier le lien de la version partageable et anonyme");
  }

  b.addEventListener("click", function(ev){
    if (lien && !ev.shiftKey){
      var dPub = lireDate(window.ANONYME.lienMaj), retard = dPub && dMaj && dPub < dMaj;
      var suite = lien + (retard ? " · La page en ligne date du " + dateLongue(dPub) + ", la carte a changé depuis : à republier." : "");
      mot("Le lien à partager : " + suite, 14000);   /* affiché tout de suite : la copie peut être refusée, ou ne jamais répondre */
      copier(lien).then(function(ok){ if (ok) mot("Lien copié : " + suite, retard ? 14000 : 8000); });
      return;
    }
    var res, i, sc, neuf, html, url, a, pose = false;
    try { res = window.ANONYME.appliquer(S); }
    catch (e){ mot("Export impossible : " + e.message, 10000); return; }

    if (res.manquants.length){
      mot("Pas de nom public pour " + res.manquants.join(", ") + " : ajoute-le dans window.ANONYME.modules, dans stack-data.js. Rien n'a été exporté.", 14000);
      return;
    }
    if (res.fuites.length){
      mot(res.fuites.length + " info" + (res.fuites.length > 1 ? "s" : "") + " sensible" + (res.fuites.length > 1 ? "s" : "")
        + " restante" + (res.fuites.length > 1 ? "s" : "") + " : " + res.fuites[0].quoi + " dans " + res.fuites[0].ou
        + ". Rien n'a été exporté.", 14000);
      return;
    }

    /* chaque module emporte son dessin, jamais son identifiant d'origine */
    res.stack.modules.forEach(function(m){ m.icone = ICONS[res.icones[m.id]] || ICONS._; });

    var corps = SQUELETTE.cloneNode(true), scripts = corps.querySelectorAll("script");
    var bp = corps.querySelector("#partage-btn"); if (bp) bp.parentNode.removeChild(bp);
    for (i = 0; i < scripts.length; i++){
      sc = scripts[i];
      if ((sc.getAttribute("src") || "").indexOf("stack-data") >= 0 || /window\.STACK\s*=/.test(sc.textContent || "")){
        neuf = document.createElement("script");
        neuf.textContent = "window.STACK = " + JSON.stringify(res.stack).replace(/<\//g, "<" + String.fromCharCode(92) + "/") + ";";
        sc.parentNode.replaceChild(neuf, sc);
        pose = true;
        break;
      }
    }
    if (!pose){ mot("Les données de la carte n'ont pas été retrouvées dans la page : rien n'a été exporté.", 10000); return; }

    var NL = String.fromCharCode(10), GUI = String.fromCharCode(34);
    html = "<!DOCTYPE html>" + NL + "<html lang=" + GUI + "fr" + GUI + ">" + NL
         + "<head>" + NL + document.head.innerHTML + NL + "</head>" + NL
         + "<body>" + NL + corps.innerHTML + NL + "</body>" + NL + "</html>";
    html = window.ANONYME.purgerPage(html, res.stack.proprietaire);
    var reste = window.ANONYME.fuitesPage(html, res.stack.proprietaire);
    if (reste.length){
      mot("Le fichier cite encore " + reste[0].quoi + " (" + reste[0].autour + "). Rien n'a ete exporte.", 14000);
      return;
    }
    url = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
    a = h("a", { href: url, download: "stack-partageable.html" });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
    mot("stack-partageable.html : " + res.stack.modules.length + " modules, sans nom d'outil, sans adresse, sans chemin, sans plan.");
  });
})();

if (window.matchMedia && !params.get("theme")) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(ev){ document.documentElement.dataset.theme = ev.matches ? "dark" : "light"; });

/* ───────── Démarrage : ?focus=<id> pré-sélectionne un module, ?filtre=<type> un filtre ───────── */
var f0 = params.get("filtre"); if (f0 && S.typesDeLien[f0]) st.filtre = f0;
var m0 = params.get("focus"); if (m0 && byId[m0]) st.epingle = m0;
if (!st.epingle && params.get("vue") === "plan" && PLAN) st.plan = true;
function recalculer(){ mesurer(); placerCurseur(); peindre(true, true); }
recalculer();
/* Compact : ?focus=<id> ouvre la fiche, ?vue=resume ouvre « ce qui demande ton attention ». Pas d'animation au premier affichage. */
if (compact.matches){

  poserFeuille(st.plan ? "pleine" : st.epingle || resumeOuvert ? "ouverte" : "fermee");
  if (st.epingle) assurerVisible(st.epingle, true);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ feuille.classList.remove("glisse"); }); });
}
if (window.ResizeObserver) new ResizeObserver(function(){ recalculer(); }).observe(map); else window.addEventListener("resize", recalculer);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(recalculer);
})();
